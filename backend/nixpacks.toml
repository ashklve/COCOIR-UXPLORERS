[phases.setup]
nixPkgs = ["php83", "php83Extensions.intl", "php83Extensions.mbstring", "php83Extensions.mysqli", "php83Extensions.pdo_mysql", "php83Extensions.pdo_sqlite", "php83Extensions.sqlite3", "php83Extensions.gd", "php83Extensions.zip", "php83Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs"]

[start]
cmd = "sh start.sh"